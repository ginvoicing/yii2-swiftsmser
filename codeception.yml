actor: Tester
paths:
    tests: tests
    output: tests/_output
    data: tests/_data
    support: tests/_support
bootstrap: _bootstrap.php
params:
    - .env
settings:
    colors: true
    memory_limit: 1024M
    error_level: E_ALL
coverage:
    enabled: true
    include:
        - src/*
    exclude:
        - tests/*
